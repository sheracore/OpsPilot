[project]
name = "opspilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sheracore", email = "m.ghaffari662@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openai>=3.51.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
opspilot = "opspilot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # pycodestyle, pyflakes, import order, bugbear, pyupgrade
ignore = ["E501"]                     # line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]

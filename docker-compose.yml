services:
  opspilot:
    build: .
    image: opspilot:dev
    ports:
      - "8100:8100"
    environment:
      OPSPILOT_LLM_BASE_URL: http://host.docker.internal:11434/v1
      OPSPILOT_LLM_API_KEY: ollama
      OPSPILOT_LLM_MODEL: ${OPSPILOT_LLM_MODEL:-llama3.2:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
